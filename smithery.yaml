# Smithery Registry: HiveVault MCP Server

startCommand:
  type: http
  configSchema:
    type: object
    properties: {}
    required: []
  url: https://mcp-vault.thehiveryiq.com/mcp

name: hivevault-mcp
displayName: HiveVault Read and Encrypted Store
version: "1.1.0"
description: >
  Read-only access to confirmed HiveVault FENR routes plus an AES-256-GCM encrypted
  item store with x402 USDC settlement on Base. Unknown routes and upstream failures
  return explicit errors. Part of Hive Civilization (thehiveryiq.com).

author:
  name: Steve Rotzin
  email: steve@thehiveryiq.com
  url: https://www.thehiveryiq.com

license: MIT
homepage: https://mcp-vault.thehiveryiq.com
repository:
  type: git
  url: https://github.com/srotzin/hive-mcp-vault

transport: streamable-http
endpoint: https://mcp-vault.thehiveryiq.com/mcp
protocol: "2024-11-05"

categories:
  - storage
  - wallet
  - agent-to-agent
  - web3
  - security

tags:
  - mcp
  - hive
  - wallet
  - a2a
  - encrypted-store
  - aes-256-gcm
  - read-api
  - usdc
  - base-l2
  - did
  - non-custodial
  - defai
  - ai-agents

runtime:
  type: node
  version: ">=18"
  command: node server.js
  env:
    - name: PORT
      default: "3000"
      required: false
